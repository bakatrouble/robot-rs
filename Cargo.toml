[package]
name = "robot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
log = "0.4.35"
mime_guess = "2.0.5"
pretty_env_logger = "0.5.0"
ring = "0.17.14"
s3 = "0.1.38"
teloxide = { version = "0.17.0", default-features = false, features = ["macros", "ctrlc_handler", "rustls", "rustls-native-roots"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
url = "2.5.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
